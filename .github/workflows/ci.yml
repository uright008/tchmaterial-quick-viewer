name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: 静态分析
        run: flutter analyze --no-pub

      # 注意：test/real_catalog_test.dart 依赖本地目录缓存，取不到时会自行 skip，
      # 因此 CI 上不需要额外准备数据，也不会失败。
      - name: 单元测试
        run: flutter test
